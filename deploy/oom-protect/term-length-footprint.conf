# Drop-in to shrink the /dev/shm term-buffer footprint (memory headroom, ag#68 follow-up).
#
# Install: cp to ~/.config/systemd/user/admin.service.d/, then apply on a node roll:
#   cp term-length-footprint.conf ~/.config/systemd/user/admin.service.d/
#   systemctl --user daemon-reload && systemctl --user restart admin   # admin re-adopts children
#   curl -s -X POST localhost:8082/api/admin/profile -d '{"name":"light","force":true}'  # rolls nodes onto the new env
#
# Each publication uses a log buffer of term-length x 3. The cluster's channels
# default to a 16m term (TRANSPORT_TERM_LENGTH) -> 48MB per publication; with ~13
# such buffers per node that is ~620MB/node. Dropping to 8m halves them (~310MB/node,
# ~1.9GB across 6 nodes). 8m is safe here: max Aeron message = term/8 = 1MB, and the
# largest egress messages (BookSnapshot, chunked TradesBatch <=2000) are well under that.
#
# NOTE: this does NOT touch the two 64m + two 32m outlier buffers per node (archive /
# replication channels that ignore TRANSPORT_TERM_LENGTH — a match#127-class issue).
# Bringing those down to 16m is a separate, careful engine change worth ~380MB/node more.
# Revert: remove this file, daemon-reload, restart admin, re-apply the profile.
[Service]
Environment="TRANSPORT_TERM_LENGTH=8m"
