# Example Prometheus scrape config for a single-box Open Exchange deployment
# (match#33 / oms#38). All endpoints are loopback-only by design — run
# Prometheus on the same box or tunnel; never expose these ports publicly.
global:
  scrape_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: match-nodes            # cluster nodes: CLUSTER_PORT_BASE + nodeId x CLUSTER_PORT_STRIDE + 6 (single host: base 9000, stride 100)
    static_configs:
      - targets: ['localhost:9006', 'localhost:9106', 'localhost:9206']
  - job_name: market-gateway         # Netty WS/HTTP server
    static_configs:
      - targets: ['localhost:8081']
  - job_name: oms                    # Micrometer /metrics (auth-exempt)
    static_configs:
      - targets: ['localhost:8080']
  - job_name: admin-gateway          # process manager / ops API (hand-rolled /metrics, auth-exempt)
    static_configs:
      - targets: ['localhost:8082']
  - job_name: market-sim             # demo simulator + end-to-end canary (sim_* series)
    static_configs:
      - targets: ['localhost:8090']
